services:
  postgres:
    image: postgres:16-alpine
    container_name: bracomil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - bracomil-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token
    container_name: bracomil-api
    restart: unless-stopped
    ports: 
    - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bracomil-net

volumes:
  postgres-data:

secrets:
  github_token:
    file: ./github_token.txt 