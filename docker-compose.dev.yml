services:
  postgres:
    image: postgres:16-alpine
    container_name: bracomil-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bracomil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bracomil_dev}
      POSTGRES_DB: ${POSTGRES_DB:-bracomil}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bracomil} -d ${POSTGRES_DB:-bracomil}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-dev-data: